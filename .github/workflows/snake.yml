# Draws the contribution graph as a snake, in the card's own colours, and
# publishes the two SVGs to the `output` branch. The README points at that
# branch, so nothing here touches main.
name: snake

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%2318D7FF&color_dots=%230B1526,%230E3355,%231769FF,%23008CFF,%2318D7FF
            dist/snake-light.svg?palette=github-light&color_snake=%230B6BD4&color_dots=%23EDF4FF,%23BBD8F5,%236FB2EC,%232B8BE0,%230B6BD4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
